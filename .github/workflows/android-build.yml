name: NexaLink Android Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, rebrand/nexalink-english]

permissions:
  contents: read

concurrency:
  group: nexalink-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Set up Go for the Shizzi datapath
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/shizzi/datapath/go.mod
          cache-dependency-path: third_party/shizzi/datapath/go.sum

      - name: Build the Shizzi Android datapath AAR
        working-directory: third_party/shizzi/datapath
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
          gomobile bind -target=android -androidapi 30 -o "$GITHUB_WORKSPACE/android/shizzi/libs/datapath.aar" .

      # Build the exact ARM64 libbox AAR consumed by the Android app.
      # Keep this in the same workflow so APK builds never race a separate artifact workflow.
      - name: Set up Go for Sing-box libbox
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: true

      - name: Set up Java 17 for Sing-box build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android NDK r28 for Sing-box
        id: setup-singbox-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build pinned Sing-box v1.14.4 libbox AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-singbox-ndk.outputs.ndk-path }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          test -s libbox.aar
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"
          unzip -Z1 libbox.aar | grep -Fxq 'jni/arm64-v8a/libbox.so'
          unzip -p libbox.aar classes.jar > /tmp/libbox-classes.jar
          jar tf /tmp/libbox-classes.jar | grep -Fxq 'io/nekohasekai/libbox/CommandServer.class'
          sha256sum "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"

      - name: Deduplicate shared gomobile runtime classes
        run: |
          python3 - <<'PY'
          import io
          import os
          import tempfile
          import zipfile

          datapath = "android/shizzi/libs/datapath.aar"
          libbox = "android/app/libs/libbox.aar"

          def read_classes(aar_path):
              with zipfile.ZipFile(aar_path, "r") as aar:
                  return aar.read("classes.jar")

          with zipfile.ZipFile(datapath, "r") as aar:
              entries = {item.filename: aar.read(item.filename) for item in aar.infolist() if not item.is_dir()}

          datapath_jar = zipfile.ZipFile(io.BytesIO(entries["classes.jar"]), "r")
          libbox_jar = zipfile.ZipFile(io.BytesIO(read_classes(libbox)), "r")
          datapath_classes = {name: datapath_jar.read(name) for name in datapath_jar.namelist() if not name.endswith("/")}
          libbox_classes = {name: libbox_jar.read(name) for name in libbox_jar.namelist() if not name.endswith("/")}
          duplicates = sorted(set(datapath_classes) & set(libbox_classes))
          mismatched = [name for name in duplicates if datapath_classes[name] != libbox_classes[name]]
          if mismatched:
              raise SystemExit("Conflicting duplicate JVM classes between gomobile AARs: " + ", ".join(mismatched))

          if not duplicates:
              raise SystemExit("Expected shared gomobile runtime classes were not found; refusing to alter AARs")

          merged_jar = io.BytesIO()
          with zipfile.ZipFile(merged_jar, "w", zipfile.ZIP_DEFLATED) as output:
              for name, data in datapath_classes.items():
                  if name not in duplicates:
                      output.writestr(name, data)

          entries["classes.jar"] = merged_jar.getvalue()
          fd, temp_path = tempfile.mkstemp(suffix=".aar", dir=os.path.dirname(datapath))
          os.close(fd)
          try:
              with zipfile.ZipFile(temp_path, "w", zipfile.ZIP_DEFLATED) as output:
                  for name, data in entries.items():
                      output.writestr(name, data)
              os.replace(temp_path, datapath)
          finally:
              if os.path.exists(temp_path):
                  os.unlink(temp_path)

          print(f"Removed {len(duplicates)} byte-identical shared classes from datapath.aar; libbox.aar supplies the common gomobile runtime.")
          PY

      - name: Restore Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Build web assets and sync Capacitor
        run: npm run android:sync

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexalink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  datapath-tests:
    name: Go datapath tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/shizzi/datapath/go.mod
          cache-dependency-path: third_party/shizzi/datapath/go.sum

      - name: Test userspace datapath
        working-directory: third_party/shizzi/datapath
        run: go test -race ./...

      - name: Vet userspace datapath
        working-directory: third_party/shizzi/datapath
        run: go vet ./...
