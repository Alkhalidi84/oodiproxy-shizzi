name: NexaLink Android Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, rebrand/nexalink-english]

permissions:
  contents: read

concurrency:
  group: nexalink-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Build web assets and sync Capacitor
        run: npm run android:sync

      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexalink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  datapath-tests:
    name: Go datapath tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/shizzi/datapath/go.mod
          cache-dependency-path: third_party/shizzi/datapath/go.sum

      - name: Test userspace datapath
        working-directory: third_party/shizzi/datapath
        run: go test -race ./...

      - name: Vet userspace datapath
        working-directory: third_party/shizzi/datapath
        run: go vet ./...
